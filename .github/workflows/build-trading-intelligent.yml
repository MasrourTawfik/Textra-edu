name: Publish Trading Intelligent CH01 v2.1

on:
  push:
    branches:
      - trading-intelligent
    paths:
      - ".github/workflows/build-trading-intelligent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ch01-v21:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct validated v2.1 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .course-build/publish-v2.1/part*.b64 | base64 -d > /tmp/ti_ch01_v21.tar.gz
          tar -xzf /tmp/ti_ch01_v21.tar.gz
          test -f .course-build/CH01_v2_1/Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour.tex
          test -f .course-build/CH01_v2_1/scripts/CH01_Generate_Figures.py
          test -f .course-build/CH01_v2_1/scripts/CH01_Generate_Notebooks.py

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .course-build/CH01_v2_1/requirements.txt
          pip install nbconvert jupyter

      - name: Install LaTeX
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-french \
            lmodern

      - name: Generate dataset, figures and notebooks
        shell: bash
        run: |
          set -euo pipefail
          cd .course-build/CH01_v2_1
          python scripts/CH01_Generate_Figures.py
          python scripts/CH01_Generate_Notebooks.py
          test -s datasets/TI_CH01_Market_Data_v1.csv
          test -s notebooks/student/CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb
          test -s notebooks/student/CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb

      - name: Execute both student notebooks
        shell: bash
        run: |
          set -euo pipefail
          cd .course-build/CH01_v2_1
          jupyter nbconvert --to notebook --execute \
            notebooks/student/CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb \
            --ExecutePreprocessor.timeout=300 \
            --output /tmp/CH01_NB01_STUDENT_EXECUTED.ipynb
          jupyter nbconvert --to notebook --execute \
            notebooks/student/CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb \
            --ExecutePreprocessor.timeout=300 \
            --output /tmp/CH01_NB02_STUDENT_EXECUTED.ipynb

      - name: Compile canonical PDF twice
        shell: bash
        run: |
          set -euo pipefail
          cd .course-build/CH01_v2_1
          TEX="Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour.tex"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          test -s Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour.pdf
          if grep -E "Undefined control sequence|Fatal error|Emergency stop|There were undefined references|Overfull \\hbox" Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour.log; then
            echo "LaTeX quality gate failed."
            exit 1
          fi

      - name: Publish clean student portal
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".course-build/CH01_v2_1"
          PDF="Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour_v2.1.pdf"
          NB1="CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb"
          NB2="CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb"

          rm -rf chapters/CH01 notebooks/CH01 data/CH01 docs
          mkdir -p chapters/CH01 notebooks/CH01 data/CH01 docs

          cp .portal/README.md README.md
          cp .portal/chapters/CH01/README.md chapters/CH01/README.md
          cp .portal/data/CH01/README.md data/CH01/README.md
          cp .portal/docs/GETTING_STARTED.md docs/GETTING_STARTED.md
          cp .portal/docs/CH01_STUDENT_GUIDE.md docs/CH01_STUDENT_GUIDE.md

          cp "$BUILD/Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour.pdf" "chapters/CH01/$PDF"
          cp "$BUILD/notebooks/student/$NB1" "notebooks/CH01/$NB1"
          cp "$BUILD/notebooks/student/$NB2" "notebooks/CH01/$NB2"
          cp "$BUILD/datasets/TI_CH01_Market_Data_v1.csv" data/CH01/TI_CH01_Market_Data_v1.csv

          rm -rf .course-build/CH01 .course-build/publish-v2.1
          rm -rf "$BUILD" .portal
          rm -rf student-packs

      - name: Public safety and completeness gates
        shell: bash
        run: |
          set -euo pipefail
          PDF="chapters/CH01/Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour_v2.1.pdf"
          NB1="notebooks/CH01/CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb"
          NB2="notebooks/CH01/CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb"
          CSV="data/CH01/TI_CH01_Market_Data_v1.csv"

          test -s "$PDF"
          test -s "$NB1"
          test -s "$NB2"
          test -s "$CSV"
          test -s docs/GETTING_STARTED.md
          test -s docs/CH01_STUDENT_GUIDE.md

          if find . -path ./.git -prune -o -type f \( -iname "*MASTER*" -o -iname "*solution*" -o -iname "*corrige*" \) -print | grep -q .; then
            echo "Private/instructor material detected in public branch."
            exit 1
          fi

          if grep -R -nE 'sandbox:|/mnt/data/|C:\\Users\\' \
              README.md chapters/CH01 notebooks/CH01 data/CH01 docs; then
            echo "Local/sandbox path detected in public material."
            exit 1
          fi

      - name: Commit published CH01 v2.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Publish CH01 v2.1 student portal"
            git push origin HEAD:trading-intelligent
          fi
