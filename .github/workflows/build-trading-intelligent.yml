name: Validate Trading Intelligent student portal

on:
  push:
    branches:
      - trading-intelligent
    paths:
      - "README.md"
      - "chapters/CH01/**"
      - "notebooks/CH01/**"
      - "data/CH01/**"
      - "docs/**"
      - ".github/workflows/build-trading-intelligent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-student-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public branch
        uses: actions/checkout@v4

      - name: Static completeness and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          PDF="chapters/CH01/Trading_Intelligent_CH01_Comprendre_Marche_Donnees_Tawfik_Masrour_v2.1.pdf"
          NB1="notebooks/CH01/CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb"
          NB2="notebooks/CH01/CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb"
          CSV="data/CH01/TI_CH01_Market_Data_v1.csv"

          test -s "$PDF"
          test -s "$NB1"
          test -s "$NB2"
          test -s "$CSV"
          test -s README.md
          test -s chapters/CH01/README.md
          test -s data/CH01/README.md
          test -s docs/GETTING_STARTED.md
          test -s docs/CH01_STUDENT_GUIDE.md

          test ! -e notebooks/CH01/CH01_NB01_Market_Data_Returns_STUDENT_Tawfik_Masrour.ipynb
          test ! -e chapters/CH01/main.pdf
          test ! -e chapters/CH01/main.tex

          if find . -path ./.git -prune -o -type f \( -iname "*MASTER*" -o -iname "*solution*" -o -iname "*corrige*" \) -print | grep -q .; then
            echo "Private/instructor material detected in public branch."
            exit 1
          fi

          if grep -R -nE 'sandbox:|/mnt/data/|C:\\Users\\' \
              README.md chapters/CH01 notebooks/CH01 data/CH01 docs; then
            echo "Local/sandbox path detected in public material."
            exit 1
          fi

      - name: Verify GitHub and Colab launch endpoints
        shell: bash
        run: |
          set -euo pipefail
          NB1_NAME="CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb"
          NB2_NAME="CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb"

          RAW1="https://raw.githubusercontent.com/MasrourTawfik/Textra-edu/trading-intelligent/notebooks/CH01/$NB1_NAME"
          RAW2="https://raw.githubusercontent.com/MasrourTawfik/Textra-edu/trading-intelligent/notebooks/CH01/$NB2_NAME"
          COLAB1="https://colab.research.google.com/github/MasrourTawfik/Textra-edu/blob/trading-intelligent/notebooks/CH01/$NB1_NAME"
          COLAB2="https://colab.research.google.com/github/MasrourTawfik/Textra-edu/blob/trading-intelligent/notebooks/CH01/$NB2_NAME"

          curl --fail --silent --show-error --location --retry 3 "$RAW1" -o /tmp/nb01.ipynb
          curl --fail --silent --show-error --location --retry 3 "$RAW2" -o /tmp/nb02.ipynb

          python - <<'PY'
          import json
          for p in ["/tmp/nb01.ipynb", "/tmp/nb02.ipynb"]:
              with open(p, encoding="utf-8") as f:
                  nb = json.load(f)
              assert nb.get("cells"), f"{p}: notebook sans cellules"
          PY

          code1="$(curl --silent --show-error --location --retry 3 --output /tmp/colab1.html --write-out '%{http_code}' "$COLAB1")"
          code2="$(curl --silent --show-error --location --retry 3 --output /tmp/colab2.html --write-out '%{http_code}' "$COLAB2")"
          test "$code1" = "200"
          test "$code2" = "200"
          test -s /tmp/colab1.html
          test -s /tmp/colab2.html

          echo "NB01 Colab HTTP: $code1"
          echo "NB02 Colab HTTP: $code2"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scipy jupyter nbconvert

      - name: Run all — NB01
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute \
            notebooks/CH01/CH01_NB01_Market_Data_OHLCV_Microstructure_Tawfik_Masrour_STUDENT.ipynb \
            --ExecutePreprocessor.timeout=300 \
            --output /tmp/CH01_NB01_STUDENT_EXECUTED.ipynb

      - name: Run all — NB02
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute \
            notebooks/CH01/CH01_NB02_Returns_Adjustments_Data_Quality_Tawfik_Masrour_STUDENT.ipynb \
            --ExecutePreprocessor.timeout=300 \
            --output /tmp/CH01_NB02_STUDENT_EXECUTED.ipynb
